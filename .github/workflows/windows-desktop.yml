name: Windows desktop

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-smoke:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-desktop-build.txt

      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-desktop-build.txt

      - name: Run automated tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -t .

      - name: Build Windows desktop
        shell: pwsh
        run: .\tools\build_desktop.ps1 -Clean

      - name: Smoke-test Windows desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeDirectory = Join-Path $env:RUNNER_TEMP "hypatia-desktop-smoke"
          New-Item -ItemType Directory -Path $smokeDirectory -Force | Out-Null
          $env:HYPATIA_DESKTOP_DATA_DIR = $smokeDirectory
          $executable = Resolve-Path ".\dist\Hypatia\Hypatia.exe"
          $workingDirectory = Split-Path -Parent $executable
          $process = Start-Process `
            -FilePath $executable `
            -WorkingDirectory $workingDirectory `
            -PassThru
          $sessionPath = Join-Path $smokeDirectory "sessions\sessions.json"
          $deadline = (Get-Date).AddSeconds(30)
          try {
            while (
              (Get-Date) -lt $deadline `
                -and -not (Test-Path -LiteralPath $sessionPath) `
                -and -not $process.HasExited
            ) {
              Start-Sleep -Milliseconds 200
            }
            if ($process.HasExited) {
              throw "Hypatia exited during smoke test with code $($process.ExitCode)."
            }
            if (-not (Test-Path -LiteralPath $sessionPath -PathType Leaf)) {
              throw "Hypatia did not create sessions.json during smoke test."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
              Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c `
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=Hypatia-windows-x64-v$version.zip" >> $env:GITHUB_OUTPUT

      - name: Create Windows archive
        shell: pwsh
        run: |
          Compress-Archive `
            -LiteralPath ".\dist\Hypatia" `
            -DestinationPath "${{ steps.package.outputs.archive }}" `
            -CompressionLevel Optimal

      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hypatia-windows-x64-v${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
